# Goes back one screen: the system back on Android, the edge swipe of the navigation stack on iOS.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "1%, 50%"
          end: "80%, 50%"
          duration: 600
