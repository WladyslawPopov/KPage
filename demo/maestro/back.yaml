# Goes back one screen: the system back on Android, the back button of the navigation bar on iOS
# (UIKit gives it the id `BackButton`; an edge swipe is not taken reliably).
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "BackButton"
