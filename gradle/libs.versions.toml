[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose-plugin = "1.12.2"

sqldelight = "2.4.1"
serialization = "1.12.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"

android-compileSdk = "37"
android-minSdk = "24"


[libraries]
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-plugin" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-plugin" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-plugin" }
ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-plugin" }

lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }


[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
